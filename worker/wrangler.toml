# Wspólny serwer gier PL3Y (Mafia + Tajniacy + Milion + Rozejrzyj się). Kod mieszka w repo mafia.
name = "pl3y-server"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Strony, z których wolno łączyć się z serwerem gry.
ALLOWED_ORIGINS = "https://pl3y.pl,https://www.pl3y.pl,https://egozaur.github.io"
# "true" pozwala łączyć się ze stron http://localhost:… (testy frontendu z prawdziwym serwerem).
# To nie jest zabezpieczenie (każdy może wysłać dowolny Origin spoza przeglądarki), tylko filtr dla przeglądarek.
ALLOW_LOCALHOST = "true"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "TJ_ROOMS"
class_name = "TjRoom"

[[durable_objects.bindings]]
name = "TJ_SAVES"
class_name = "TjSaves"

[[durable_objects.bindings]]
name = "ML_ROOMS"
class_name = "MlRoom"

[[durable_objects.bindings]]
name = "ML_SCORES"
class_name = "MlScores"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TjRoom", "TjSaves"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["MlRoom", "MlScores"]

[[durable_objects.bindings]]
name = "RZ_WORDS"
class_name = "RzWords"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["RzWords"]

[observability]
enabled = true
